<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Character designer</title>
        <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
        <script src="./script.js" defer></script>
        <style>
            h2,
            h3 {
                font-family: system-ui;
            }
            h2 {
                margin-bottom: 0.25em;
            }
            h3 {
                margin: 0 0;
                /* font-weight: normal; */
            }
            #colors {
                /* border: 1px solid blue; */
                width: min-content;
                display: flex;
                align-items: flex-start;
                margin-bottom: 10px;
            }
            #colors > div:first-child {
                height: 175px;
                width: 175px;
                margin-right: 5px;
                padding: 10px;
                background: black;
            }
            #colors > div:first-child div {
                vertical-align: top;
                display: flex;
            }
            #colors > div:first-child span {
                background: white;
                padding: 2px;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 14px;
                line-height: 14px;
            }
            #colors > div:first-child input {
                width: 100%;
            }
            #colors > div:last-child {
                width: min-content;
                display: grid;
                grid-template-columns: repeat(8, 100px);
                grid-template-rows: repeat(2, 100px);
            }
            #editor {
                /* border: 1px solid green; */
                width: min-content;
                display: flex;
                align-items: flex-start;
            }
            #editor > div {
                flex: 1;
                margin: 0 10px 10px 0;
            }
            #viewer {
                display: grid;
                grid-template-columns: repeat(2, 40px);
                grid-template-rows: repeat(4, 40px);
                border-bottom: 1px solid black;
                border-right: 1px solid black;
                width: fit-content;
                padding: 0 1px 1px 0;
                background-color: #fff;
                background-image:
                    linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
                    linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
                background-position:
                    0 0,
                    5px 5px;
                background-size: 10px 10px;
            }
            canvas {
                display: block;
                cursor: pointer;
                border-top: 1px solid black;
                border-left: 1px solid black;
            }
            canvas.current {
                box-shadow: 0 0 10px black;
                z-index: 100;
            }
            .handsontable {
                font-family: 'Courier New', Courier, monospace !important;
            }
            #colors .handsontable {
                --ht-border-radius: 0px;
            }
            #colors .handsontable td {
                font-size: 10px;
                padding: 0;
                line-height: 5px;
                height: 5px;
                border: none !important;
            }
            #colors .handsontable .wtHider,
            #colors .handsontable .wtSpreader {
                height: fit-content !important;
            }
            #source {
                /* border: 1px solid blue; */
                width: min-content;
                display: flex;
                align-items: flex-start;
            }
            #source > div {
                /* flex: 1; */
                margin: 0 10px 10px 0;
            }
        </style>
    </head>
    <body>
        <h2>Editor</h2>
        <h3>Color Picker</h3>
        <div id="colors">
            <div>
                <div>
                    <span>H</span>
                    <input type="range" min="0" max="15" value="0" />
                    <span>0</span>
                </div>
                <div>
                    <span>S</span>
                    <input type="range" min="0" max="15" value="0" />
                    <span>0</span>
                </div>
                <div>
                    <span>V</span>
                    <input type="range" min="0" max="15" value="0" />
                    <span>0</span>
                </div>
            </div>
            <div></div>
        </div>
        <div id="editor">
            <div class="bmp"><h3>Bitmap</h3></div>
            <div class="palette"><h3>Palette</h3></div>
            <div class="sprite"><h3>Sprite</h3></div>
        </div>
        <h2>Viewer</h2>
        <div id="viewer"></div>
        <input type="button" value="test" id="test" />
        <h2>Source</h2>
        <div id="source">
            <div class="palette">
                <h3>Palette</h3>
                <textarea rows="10" cols="50">200613412000653540633666655320013244355</textarea>
            </div>
            <div class="chr">
                <h3>Character</h3>
                <textarea rows="10" cols="50">
AAAAAAAAAAAAAAAAAAAAAAAAAAEAAAESAAASIwABIzQ
AAAAAAAAAAAAAAAAAAAAABERAAAlIhAAZYMQAERERAA
ABI0RAEzREQBM0R4B5RHeHqUR5h6dESZB3dJlARHd0Q
REREQERERECHiEQASUhAAElImgB3mZoAp3d6AEREREA
AER3mQAEd3cAAEMxAAEiEwATIioAEzIqALEzIgC7EzE
REREAHd3oAAaqgAAqIigAIiIigCIiIoAqIigABqqAAA
ALyxEQC8zN0AC8zNAAvMzAAAu7sAAKqqAABKqgAAREQ
3dywAN3csADbywAAy8sAALuwAACkpAAApUVAAEREQAA</textarea>
            </div>
            <div class="sprite">
                <h3>Sprite</h3>
                <textarea rows="10" cols="50"></textarea>
            </div>
        </div>
    </body>
</html>
