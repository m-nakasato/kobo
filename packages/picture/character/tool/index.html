<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Character designer</title>
        <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
        <script src="./script.js" defer></script>
        <style>
            #colors {
                /* border: 1px solid blue; */
                width: min-content;
                display: flex;
                align-items: flex-start;
                margin-bottom: 10px;
            }
            #colors > div {
                flex: 1;
                min-width: 147px;
            }
            #colors > div:first-child {
                height: 126px;
                min-width: 126px;
                padding: 10px;
                border: 1px solid black;
                background: black;
            }
            #colors > div:first-child div {
                vertical-align: top;
                display: flex;
            }
            #colors > div:first-child span {
                background: white;
                padding: 2px;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 14px;
                line-height: 14px;
            }
            #colors > div:first-child input {
                width: 100px;
            }
            #editor {
                /* border: 1px solid green; */
                width: min-content;
                display: flex;
                align-items: flex-start;
            }
            #editor > div {
                flex: 1;
                margin: 0 10px 10px 0;
            }
            #viewer {
                display: grid;
                grid-template-columns: repeat(2, 40px);
                grid-template-rows: repeat(4, 40px);
                border-bottom: 1px solid black;
                border-right: 1px solid black;
                width: fit-content;
                padding: 0 1px 1px 0;
            }
            canvas {
                display: block;
                cursor: pointer;
                border-top: 1px solid black;
                border-left: 1px solid black;
            }
            canvas.current {
                box-shadow: 0 0 10px black;
                z-index: 100;
            }
            .handsontable {
                font-family: 'Courier New', Courier, monospace !important;
            }
            #colors .handsontable {
                --ht-border-radius: 0px;
            }
            #colors .handsontable td {
                font-size: 10px;
                padding: 0;
                line-height: 20px;
                height: 20px;
            }
            #colors .handsontable .wtHider,
            #colors .handsontable .wtSpreader {
                height: 147px !important;
            }
        </style>
    </head>
    <body>
        color picker
        <div id="colors">
            <div>
                <div>
                    <span>R</span>
                    <input type="range" min="0" max="6" value="0" />
                    <span>0</span>
                </div>
                <div>
                    <span>G</span>
                    <input type="range" min="0" max="6" value="0" />
                    <span>0</span>
                </div>
                <div>
                    <span>B</span>
                    <input type="range" min="0" max="6" value="0" />
                    <span>0</span>
                </div>
            </div>
        </div>
        <div id="editor">
            <div id="bmp">bitmap</div>
            <div id="palette">palette</div>
        </div>
        viewer
        <div id="viewer"></div>
        <input type="button" value="test" id="test" />
        <input type="button" value="view" id="view" />
        <div id="source">

    </body>
</html>
